name: Update Le Quest market data

on:
  schedule:
    # Weekly on Monday at 01:00 UTC (09:00 SGT) — after weekend transaction updates
    - cron: '0 1 * * 1'
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch URA market data and write data.json
        run: python fetch_market_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update Le Quest market data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
